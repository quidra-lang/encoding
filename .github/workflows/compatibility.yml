name: Quidra 0.6 compatibility
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quidra-lang/quidra
          ref: 61eb1411721c7eb7f444c6d9af15fb72fbeb7a6a
          path: core
      - run: sudo apt-get update && sudo apt-get install -y llvm clang cmake libcurl4-openssl-dev
      - run: cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release && cmake --build core/build --target quidra --parallel 3
      - run: bash tests/integration.sh "$PWD/core/build/quidra"
